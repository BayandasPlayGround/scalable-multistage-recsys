name: Deploy Azure

on:
  workflow_dispatch:

jobs:
  validate-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Azure scaffold presence
        run: |
          test -f infra/azure/bicep/main.bicep
          test -f infra/azure/aml/train-job.yml
          test -f infra/azure/aks/deployment.yaml
