[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-recsys"
version = "0.1.0"
description = "Azure-first production scaffold for the Amazon recommender system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "annoy",
  "fastapi",
  "httpx",
  "jinja2",
  "mlflow",
  "numpy",
  "pandas",
  "pydantic-settings",
  "pyarrow",
  "python-dotenv",
  "scikit-learn",
  "scipy",
  "tensorflow",
  "tqdm",
  "uvicorn[standard]",
  "xgboost",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
amazon-recsys = "amazon_recsys.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p no:tmpdir"
testpaths = ["tests"]
markers = [
  "foundation: fast scaffolding and import tests",
  "config: settings and container tests",
  "data: corpus and split tests",
  "retrieval: candidate generation and retriever tests",
  "ranking: ranker and recommendation service tests",
  "serving: API, web, and bundle serving tests",
  "infra: docker, workflow, and deployment scaffold tests",
  "slow: longer-running integration tests",
  "azure: Azure-specific scaffold tests",
]
