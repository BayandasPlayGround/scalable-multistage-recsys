[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-recsys"
version = "0.1.0"
description = "Package-owned Amazon recommender with bundle serving, monitoring, and notebook compatibility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "annoy",
  "fastapi",
  "httpx",
  "jinja2",
  "mlflow",
  "numpy",
  "onnx",
  "onnxmltools",
  "onnxruntime",
  "pandas",
  "pydantic-settings",
  "pyarrow",
  "python-dotenv",
  "scikit-learn",
  "scipy",
  "tensorflow",
  "tqdm",
  "uvicorn[standard]",
  "xgboost",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.8,<1",
]

[project.scripts]
amazon-recsys = "amazon_recsys.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amazon_recsys.web" = [
  "static/*",
  "templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p no:tmpdir"
testpaths = ["tests"]
markers = [
  "foundation: fast import, compatibility, and template tests",
  "config: settings and container tests",
  "data: corpus and split tests",
  "retrieval: candidate generation and retriever tests",
  "ranking: ranker and recommendation service tests",
  "serving: API, web, and bundle serving tests",
  "infra: docker, workflow, and deployment support tests",
  "slow: longer-running integration tests",
  "azure: Azure-specific compatibility and deployment tests",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [
  "Research",
  "notebooks/RecSys.ipynb",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_mlflow_integration.py" = ["E402"]
"tests/test_onnx_bundle.py" = ["E402"]
